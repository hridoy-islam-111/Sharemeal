<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ShareMeal - Get Food Post By ID</title>
</head>

<body>

    <h1>Get Food Post By ID</h1>

    <label>Food Post ID:</label>

    <input
        type="number"
        id="foodPostId"
        placeholder="Example: 1"
    >

    <button onclick="getFoodPostById()">
        Get Food Post
    </button>

    <h2>Response</h2>

    <pre id="result">Enter an ID and click the button...</pre>


    <script>

        async function getFoodPostById() {

            const id =
                document.getElementById("foodPostId").value;


            if (!id) {

                alert("Please enter a Food Post ID.");

                return;

            }


            try {

                const response = await fetch(
                    `/api/food-posts/${id}`
                );

                const result =
                    await response.text();

                document.getElementById("result").textContent =
                    "Status: " +
                    response.status +
                    "\n\n" +
                    result;

            } catch (error) {

                document.getElementById("result").textContent =
                    "Error: " +
                    error.message;

            }

        }

    </script>

</body>
</html>
