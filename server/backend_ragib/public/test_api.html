<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>ShareMeal API Tester</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .section {
            border: 1px solid #ccc;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            cursor: pointer;
        }

        pre {
            background: #f4f4f4;
            padding: 15px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <h1>ShareMeal API Tester</h1>


    <!-- ====================================== -->
    <!-- CREATE FOOD POST -->
    <!-- ====================================== -->

    <div class="section">

        <h2>1. Create Food Post</h2>

        <label>Title</label>
        <input
            type="text"
            id="title"
            placeholder="Example: Chicken Biryani"
        >

        <label>Description</label>
        <textarea
            id="description"
            placeholder="Example: Fresh chicken biryani"
        ></textarea>

        <label>Pickup Time</label>
        <input
            type="time"
            id="pickup_time"
        >

        <label>Latitude</label>
        <input
            type="number"
            step="any"
            id="latitude"
            placeholder="Example: 23.8103"
        >

        <label>Longitude</label>
        <input
            type="number"
            step="any"
            id="longitude"
            placeholder="Example: 90.4125"
        >

        <button onclick="createFoodPost()">
            Create Food Post
        </button>

    </div>


    <!-- ====================================== -->
    <!-- GET ALL FOOD POSTS -->
    <!-- ====================================== -->

    <div class="section">

        <h2>2. Get All Food Posts</h2>

        <button onclick="getAllFoodPosts()">
            Get All Food Posts
        </button>

    </div>


    <!-- ====================================== -->
    <!-- GET FOOD POST BY ID -->
    <!-- ====================================== -->

    <div class="section">

        <h2>3. Get Food Post By ID</h2>

        <label>Food Post ID</label>

        <input
            type="number"
            id="getId"
            placeholder="Example: 1"
        >

        <button onclick="getFoodPostById()">
            Get Food Post
        </button>

    </div>


    <!-- ====================================== -->
    <!-- UPDATE FOOD POST -->
    <!-- ====================================== -->

    <div class="section">

        <h2>4. Update Food Post</h2>

        <label>Food Post ID</label>

        <input
            type="number"
            id="updateId"
            placeholder="Example: 1"
        >

        <label>New Title</label>

        <input
            type="text"
            id="updateTitle"
            placeholder="Example: Vegetable Biryani"
        >

        <label>New Description</label>

        <textarea
            id="updateDescription"
            placeholder="New description"
        ></textarea>

        <label>New Pickup Time</label>

        <input
            type="time"
            id="updatePickupTime"
        >

        <button onclick="updateFoodPost()">
            Update Food Post
        </button>

    </div>


    <!-- ====================================== -->
    <!-- DELETE FOOD POST -->
    <!-- ====================================== -->

    <div class="section">

        <h2>5. Delete Food Post</h2>

        <label>Food Post ID</label>

        <input
            type="number"
            id="deleteId"
            placeholder="Example: 1"
        >

        <button onclick="deleteFoodPost()">
            Delete Food Post
        </button>

    </div>


    <!-- ====================================== -->
    <!-- RESULT -->
    <!-- ====================================== -->

    <div class="section">

        <h2>API Response</h2>

        <pre id="result">Result will appear here...</pre>

    </div>



    <script>

        // ======================================
        // SHOW RESULT
        // ======================================

        function showResult(status, data) {

            document.getElementById("result").textContent =
                "HTTP Status: " + status + "\n\n" +
                JSON.stringify(data, null, 2);
        }



        // ======================================
        // CREATE FOOD POST
        // ======================================

        async function createFoodPost() {

            const title =
                document.getElementById("title").value;

            const description =
                document.getElementById("description").value;

            const pickup_time =
                document.getElementById("pickup_time").value;

            const latitude =
                document.getElementById("latitude").value;

            const longitude =
                document.getElementById("longitude").value;


            // Check required fields

            if (
                !title ||
                !description ||
                !pickup_time ||
                !latitude ||
                !longitude
            ) {

                alert("Please fill in all fields.");

                return;
            }


            const foodData = {

                title: title,

                description: description,

                pickup_time: pickup_time,

                latitude: Number(latitude),

                longitude: Number(longitude)

            };


            try {

                const response = await fetch(
                    "/api/food-posts",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify(foodData)

                    }
                );


                const text =
                    await response.text();


                let data;

                try {

                    data = JSON.parse(text);

                } catch {

                    data = text;

                }


                showResult(
                    response.status,
                    data
                );


            } catch (error) {

                showResult(
                    "ERROR",
                    error.message
                );

            }

        }



        // ======================================
        // GET ALL FOOD POSTS
        // ======================================

        async function getAllFoodPosts() {

            try {

                const response =
                    await fetch(
                        "/api/food-posts"
                    );


                const text =
                    await response.text();


                let data;

                try {

                    data = JSON.parse(text);

                } catch {

                    data = text;

                }


                showResult(
                    response.status,
                    data
                );


            } catch (error) {

                showResult(
                    "ERROR",
                    error.message
                );

            }

        }



        // ======================================
        // GET FOOD POST BY ID
        // ======================================

        async function getFoodPostById() {

            const id =
                document.getElementById("getId").value;


            if (!id) {

                alert("Please enter Food Post ID.");

                return;
            }


            try {

                const response =
                    await fetch(
                        `/api/food-posts/${id}`
                    );


                const text =
                    await response.text();


                let data;

                try {

                    data = JSON.parse(text);

                } catch {

                    data = text;

                }


                showResult(
                    response.status,
                    data
                );


            } catch (error) {

                showResult(
                    "ERROR",
                    error.message
                );

            }

        }



        // ======================================
        // UPDATE FOOD POST
        // ======================================

        async function updateFoodPost() {

            const id =
                document.getElementById("updateId").value;

            const title =
                document.getElementById("updateTitle").value;

            const description =
                document.getElementById("updateDescription").value;

            const pickup_time =
                document.getElementById("updatePickupTime").value;


            if (!id) {

                alert("Please enter Food Post ID.");

                return;
            }


            const updateData = {

                title: title,

                description: description,

                pickup_time: pickup_time

            };


            try {

                const response =
                    await fetch(
                        `/api/food-posts/${id}`,
                        {

                            method: "PUT",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(updateData)

                        }
                    );


                const text =
                    await response.text();


                let data;

                try {

                    data = JSON.parse(text);

                } catch {

                    data = text;

                }


                showResult(
                    response.status,
                    data
                );


            } catch (error) {

                showResult(
                    "ERROR",
                    error.message
                );

            }

        }



        // ======================================
        // DELETE FOOD POST
        // ======================================

        async function deleteFoodPost() {

            const id =
                document.getElementById("deleteId").value;


            if (!id) {

                alert("Please enter Food Post ID.");

                return;
            }


            if (
                !confirm(
                    "Are you sure you want to delete this food post?"
                )
            ) {

                return;
            }


            try {

                const response =
                    await fetch(
                        `/api/food-posts/${id}`,
                        {

                            method: "DELETE"

                        }
                    );


                const text =
                    await response.text();


                let data;

                try {

                    data = JSON.parse(text);

                } catch {

                    data = text;

                }


                showResult(
                    response.status,
                    data
                );


            } catch (error) {

                showResult(
                    "ERROR",
                    error.message
                );

            }

        }

    </script>

</body>

</html>
